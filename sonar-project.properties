# Configuração do SonarScanner para o Super Benfica Web (SonarQube Cloud).
# O token (SONAR_TOKEN) vem do secret do GitHub Actions ou da variável de ambiente local.

sonar.organization=trobozoi
sonar.projectKey=trobozoi_superbenfica-web
sonar.projectName=Super Benfica Web
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx

# Relatório gerado por: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,.next/**,coverage/**,**/*.d.ts
# Páginas, componentes visuais, hooks React, chamadas HTTP finas e código só de servidor (BFF)
# são validados pelos testes E2E (Playwright), que não geram lcov.
# A lógica (utils, services, realtime, stores) tem cobertura de unidade.
sonar.coverage.exclusions=src/app/**,src/components/**,src/lib/hooks/**,src/lib/api/auth.ts,src/lib/api/catalog.ts,src/lib/api/customers.ts,src/lib/api/orders.ts,src/lib/api/products.ts,src/lib/server/**,src/types/**,src/proxy.ts
